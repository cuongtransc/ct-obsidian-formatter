min_version = "2026.2.18"

[tools]
node = "24"

[env]
_.path = ['{{config_root}}/node_modules/.bin']
NODE_ENV = "{{ env.NODE_ENV | default(value='development') }}"

# ─── Setup ────────────────────────────────────────────────────────
[tasks.install]
alias = "i"
description = "Install npm deps; auto-runs before build/test/lint/dev"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm install"

[tasks.clean]
description = "Delete dist/ and node_modules for a clean rebuild"
run = "rm -rf dist node_modules"

# ─── Build ────────────────────────────────────────────────────────
[tasks.dev]
alias = "d"
description = "esbuild watch: rebuild the bundle on every save"
depends = ["install"]
run = "node scripts/esbuild.config.mjs"

[tasks.build]
alias = "b"
description = "Type-check then bundle dist/main.js for release"
depends = ["install"]
sources = ["src/**/*.ts", "src/styles.css", "tsconfig.json", "scripts/esbuild.config.mjs"]
outputs = ["dist/main.js"]
run = "tsc -noEmit -skipLibCheck && node scripts/esbuild.config.mjs production"

# ─── Quality ──────────────────────────────────────────────────────
[tasks.typecheck]
alias = "tc"
description = "Static type check only (tsc -noEmit); no bundle, no tests"
depends = ["install"]
run = "tsc -noEmit -skipLibCheck"

[tasks.lint]
alias = "l"
description = "Type-check + ESLint over src/ and tests/"
depends = ["install"]
run = """
tsc -noEmit -skipLibCheck
eslint src tests
"""

[tasks.test]
alias = "t"
description = "Run formatter unit tests"
depends = ["install"]
run = "tsx --test tests/formatter.test.ts"

[tasks.ci]
description = "Lint + test (use this in CI pipelines)"
depends = ["lint", "test"]
run = "echo 'CI checks passed.'"

# ─── Release ──────────────────────────────────────────────────────
[tasks.version]
description = "Bump version in manifest and versions files"
run = "node scripts/version-bump.mjs && git add manifest.json versions.json"

[tasks.deploy]
description = "Build, then copy the plugin into local Obsidian vaults"
depends = ["build"]
run = """
set -eu
plugin=".obsidian/plugins/ct-obsidian-formater"

# Target vaults — one path per line. Add/remove freely; blank lines and
# '#' comments are ignored. $HOME expands (heredoc delimiter is unquoted).
while IFS= read -r vault; do
  case "$vault" in ''|'#'*) continue ;; esac
  [ -d "$vault" ] || { echo "deploy: vault not found: $vault" >&2; exit 1; }
  dir="$vault/$plugin"
  mkdir -p "$dir"
  cp dist/main.js dist/manifest.json dist/styles.css "$dir/"
  echo "deployed -> $dir"
done <<EOF
$HOME/Dev/PCT/11-Notes/ct-pkm
$HOME/Notes/cr-notes
$HOME/Notes/ct-books
$HOME/Notes/ct-notes
$HOME/Notes/t1-notes-ai
EOF
"""
