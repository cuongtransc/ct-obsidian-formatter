min_version = "2026.9.0"

[settings]
experimental = true

[tools]
node = "24"

[env]
_.path = ['{{config_root}}/node_modules/.bin']
NODE_ENV = "{{ env.NODE_ENV | default(value='development') }}"

[deps.npm]
auto = true
run = "npm ci"

[tasks.dev]
description = "Rebuild main.js on change while developing in a vault"
run = "node scripts/esbuild.config.mjs"

[tasks.build]
description = "Produce the release bundle in dist/"
sources = ["src/**/*.ts", "src/styles.css", "manifest.json", "tsconfig.json", "scripts/esbuild.config.mjs"]
outputs = ["dist/main.js", "dist/manifest.json", "dist/styles.css"]
run = "tsc -noEmit -skipLibCheck && node scripts/esbuild.config.mjs production"

[tasks.test]
description = "Run the formatter unit tests"
run = "tsx --test tests/formatter.test.ts"

[tasks.typecheck]
description = "Type-check without emitting; fastest signal after an edit"
run = "tsc -noEmit -skipLibCheck"

[tasks.lint]
description = "ESLint over src/ and tests/ (read-only)"
run = "eslint src tests"

[tasks."ci:fast"]
description = "Quick gate while working: types, lint, tests"
run = ["mise run typecheck", "mise run lint", "mise run test"]

[tasks.ci]
description = "Full gate before merge: types, lint, tests, bundle"
run = ["mise run typecheck", "mise run lint", "mise run test", "mise run build"]

[tasks."ci:full"]
description = "Same as ci; the repo has no slower suite"
run = ["mise run typecheck", "mise run lint", "mise run test", "mise run build"]

[tasks.clean]
description = "Remove build output and node_modules to force a fresh install"
run = "rm -rf dist node_modules"

[tasks."ext:install"]
description = "Install the built plugin into this machine's Obsidian vaults"
depends = ["build"]
run = "obsidian-plugin-install"
